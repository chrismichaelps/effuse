name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Supported Node quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Verify Node.js policy
        run: pnpm check:node

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: SSR performance budgets
        run: node scripts/performance/ssr-runtime.mjs --check

  bun:
    name: Bun adapter conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      # pnpm needs Node to install; the suite itself runs under Bun.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Tracking latest is deliberate. The job exists to hold the adapter's
      # published capability claims to account against the runtime it targets,
      # and pinning would let a Bun-side regression pass unnoticed. It runs as
      # its own job so a Bun failure never muddies the Node gate's signal.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Bun adapter conformance
        run: pnpm --filter @effuse/server test:bun

      - name: Build Core benchmark artifact
        run: pnpm --filter @effuse/core build

      - name: Bun SSR performance budgets
        run: bun scripts/performance/ssr-runtime.mjs --check
